# .readthedocs.yaml

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Highest interpreter Read the Docs offers; the repo develops on 3.14
    # (.python-version) but RTD does not provide it yet.
    python: "3.13"

sphinx:
  configuration: docs/conf.py

# Doc dependencies live in the `docs` extra of pyproject.toml, not in a
# separate requirements file.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
