[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-env"
version = "2.1.0"
description = "mobile-env: An Open Environment for Autonomous Coordination in Wireless Mobile Networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Stefan Schneider" },
    { name = "Stefan Werner" },
]
keywords = ["reinforcement-learning", "gymnasium", "mobile-networks", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Everything needed to create, step AND render an environment. Rendering is a
# headline feature, so matplotlib and pygame are not optional.
dependencies = [
    "gymnasium>=1.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.0",
    # pygame-ce, not pygame: it is the fork gymnasium itself depends on, it
    # ships cp314 wheels (pygame has none, so 3.14 compiles from source), and
    # it is actively released. Drop-in — the import is still `import pygame`.
    "pygame-ce>=2.5",
    "shapely>=2.0",
    "svgpath2mpl>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "sb3-contrib>=2.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
# `mobile_env.wrappers.multi_agent` imports ray at module scope. Nothing else
# imports that module, so ray stays out of the default install.
rllib = [
    # >=2.9.0 is the oldest release with a stable RLModule API; the wrapper and
    # tests/test_rllib.py use RLlib's "new API stack" (per-agent spaces,
    # Algorithm.get_module() + forward_inference()), not the removed
    # Algorithm.compute_single_action().
    "ray[rllib]>=2.9.0",
    # RLlib needs a DL framework for the multi-agent PPO example; it also arrives
    # transitively via stable-baselines3, but the wrapper depends on it directly.
    "torch",
]

# PEP 735 group, installed by `uv sync` by default. ci.yml runs `uv run ruff`,
# `uv run mypy` and `uv run pytest` after `uv sync --locked`, so the tools have
# to be resolvable in the project environment.
[dependency-groups]
dev = [
    # pin the current gymnasium for development and CI; the runtime floor stays
    # permissive so `.[rllib]` can still resolve ray's exact gymnasium==1.2.2
    "gymnasium>=1.3",
    "ruff>=0.16",
    "mypy>=1.13",
    "pytest>=8.0",
    "sb3-contrib>=2.0",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/stefanbschneider/mobile-env"
Documentation = "https://mobile-env.readthedocs.io"
Repository = "https://github.com/stefanbschneider/mobile-env"

[tool.uv]
# ray[rllib] pins `gymnasium==1.2.2` exactly. Without this, that pin propagates
# through uv.lock and holds contributors and CI a minor behind the gymnasium a
# plain `pip install mobile-env` produces. Declaring the extra as conflicting
# makes uv resolve it in its own fork instead.
conflicts = [[{ extra = "rllib" }, { group = "dev" }]]

[tool.setuptools.packages.find]
include = ["mobile_env*"]

[tool.ruff]
# Match upstream (stefanbschneider/mobile-env) exactly. This is a fork we keep
# syncing from: a different width reflows every line of every file, which turns
# each sync into a whole-tree conflict rather than a review of real changes.
line-length = 100
target-version = "py310"
# Not this project's code: bin/ and .claude/ are delivered by claude-meta and are
# overwritten by the next broadcast, so linting them only creates churn.
# Notebooks are executed artifacts, checked by running them, not by linting.
extend-exclude = [".claude", "bin", "examples"]

[tool.ruff.format]
# Docs are teaching material: mechanical formatting collapsed handler stub
# bodies to one line, which reads worse than what the author wrote.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
]
ignore = [
    "E203",  # whitespace before ':' — disagrees with the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-export / import-for-side-effect
# `obs, reward, terminated, truncated, info = env.step(...)` is the gymnasium
# step signature; naming all five documents it even where a test reads one.
"tests/*" = ["RUF059"]
"docs/scripts/*" = ["RUF059"]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use PEP 695 `type` statements, so
# pinning to the 3.10 floor makes mypy fail inside numpy before reaching our code.
# The floor is enforced by requires-python and by the test matrix instead.
files = ["mobile_env"]
# gymnasium ships types, but pygame, shapely, svgpath2mpl and ray do not.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
