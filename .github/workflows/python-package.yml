# This workflow runs the build, lints, and tests

name: matrix-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{matrix.platform}}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # Installs from pyproject.toml with the `test` extra; the old
    # tests/requirements.txt was folded into it.
    - name: Install mobile-env and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[test]'

    # Linting and type-checking run once, in ci.yml. This workflow answers a
    # different question: does the package install and pass its tests on every
    # supported interpreter and operating system?
    - name: Run tests with pytest
      run: |
        pytest
